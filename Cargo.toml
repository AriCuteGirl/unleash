[package]
name = "unleash"
version = "0.1.0"
edition = "2024"
description = "An archive manager that looks like your Hyprland rice"
license = "MIT"
repository = "https://github.com/AriCuteGirl/unleash"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
liblzma = "0.4"

[profile.release]
lto = "thin"
